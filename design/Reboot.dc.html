<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TWRP reboot, Ink OS style</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111}a:hover{color:#000}
</style>
</helmet>
<div style="width: 412px; height: 824px; box-sizing: border-box; background: #FFFFFF; color: #111111; font-family: 'Figtree', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="height: 30px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600">
    <span>CPU 37 °C</span><span>96% · 11:42</span>
  </div>
  <div style="padding: 14px 14px 4px; display: flex; align-items: center; gap: 6px">
    <button style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center" aria-label="Back"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 4l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">Reboot</h1>
  </div>
  <div style="margin: 18px 26px 0; display: flex; align-items: center; justify-content: space-between; font-size: 14px">
    <span style="color: #5C5C5C">Current slot</span>
    <span style="display: flex; gap: 6px">
      <span style="min-width: 40px; height: 32px; border-radius: 16px; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700">A</span>
      <span style="min-width: 40px; height: 32px; box-sizing: border-box; border: 2px solid #111111; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700">B</span>
    </span>
  </div>
  <div style="margin: 24px 22px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 24px; column-gap: 8px">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="6">
      <button style="all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 9px" aria-label="{{o.label}}">
        <span style="width: 74px; height: 74px; box-sizing: border-box; border: 2px solid #111111; border-radius: 19px; display: flex; align-items: center; justify-content: center">
          <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{o.icon}}"></path></svg>
        </span>
        <span style="font-size: 14px; font-weight: 600; text-align: center">{{o.label}}</span>
      </button>
    </sc-for>
  </div>
  <div style="margin: 30px 22px 0; box-sizing: border-box; border: 2px solid #111111; border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" style="flex-shrink: 0"><circle cx="11" cy="11" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle><path d="M11 6.5v5.5M11 15v0.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
    <span style="font-size: 13px; line-height: 1.45">Power Off leaves the “Device powered off” picture on the screen. With a cable plugged in, the charger screen replaces it.</span>
  </div>
  <div style="flex-grow: 1"></div>
  <nav style="height: 58px; display: flex; align-items: center; justify-content: space-around; padding: 0 46px" aria-label="Navigation">
    <button style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center" aria-label="Back"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M16 3.5L5 11l11 7.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg></button>
    <button style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center" aria-label="Home"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle></svg></button>
    <button style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center" aria-label="Console"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="3.5" y="3.5" width="15" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"></rect></svg></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":824}}'>
class Component extends DCLogic {
  renderVals() {
    const opts = [
      { label: 'System', icon: 'M16 6v9M10.5 9.2a9 9 0 1 0 11 0' },
      { label: 'Power off', icon: 'M8 7h16v18H8zM12 25v3M20 25v3M12 13h8' },
      { label: 'Recovery', icon: 'M16 5a11 11 0 1 0 0 22 11 11 0 0 0 0-22zM12 13l4-4 4 4M16 9v14' },
      { label: 'Bootloader', icon: 'M7 8h18v16H7zM11 13l4 3-4 3M17 19h4' },
      { label: 'Fastbootd', icon: 'M7 8h18v16H7zM11 19h10M11 14h6' },
      { label: 'EDL', icon: 'M9 6h14v20H9zM13 11h6M13 16h6M13 21h3' }
    ];
    return { opts };
  }
}
</script>
</body>
</html>
